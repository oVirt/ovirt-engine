---
- name: Create modules-load.d drop-in for NVMe-oF kernel modules
  ansible.builtin.copy:
    content: |
      # NVMe-oF kernel modules required for NVMe/TCP storage domains
      nvme
      nvme-tcp
      nvme-fabrics
    dest: /etc/modules-load.d/ovirt-nvmeof.conf
    owner: root
    group: root
    mode: "0644"
  when: nvmeof_setup_ensure_modules_loaded | bool
  register: nvmeof_modules_conf

- name: Load NVMe-oF kernel modules
  community.general.modprobe:
    name: "{{ item }}"
    state: present
    persistent: present
  loop:
    - nvme
    - nvme-tcp
    - nvme-fabrics
  when:
    - nvmeof_setup_ensure_modules_loaded | bool
    - nvmeof_modules_conf is changed

- name: Check if NVMe host NQN file exists
  ansible.builtin.stat:
    path: /etc/nvme/hostnqn
  register: nvmeof_hostnqn_file
  when: nvmeof_setup_ensure_hostnqn | bool

- name: Generate NVMe host NQN
  ansible.builtin.command:
    cmd: nvme gen-hostnqn
  register: nvmeof_hostnqn_gen
  when:
    - nvmeof_setup_ensure_hostnqn | bool
    - not nvmeof_hostnqn_file.stat.exists

- name: Ensure NVMe host NQN directory
  ansible.builtin.file:
    path: /etc/nvme
    state: directory
    owner: root
    group: root
    mode: "0755"
  when:
    - nvmeof_setup_ensure_hostnqn | bool
    - not nvmeof_hostnqn_file.stat.exists

- name: Write NVMe host NQN
  ansible.builtin.copy:
    content: "{{ nvmeof_hostnqn_gen.stdout }}\n"
    dest: /etc/nvme/hostnqn
    owner: root
    group: root
    mode: "0644"
  when:
    - nvmeof_setup_ensure_hostnqn | bool
    - not nvmeof_hostnqn_file.stat.exists

- name: Enable NVMe auto-connect service
  ansible.builtin.systemd:
    name: nvmf-autoconnect
    enabled: true
    daemon_reload: true
  when: nvmeof_setup_ensure_autoconnect | bool
